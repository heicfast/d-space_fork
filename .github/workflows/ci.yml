name: CI

# DiskWizard merged CI — engine (Rust) + frontend (React) gates.
# Rust jobs mirror the proven d-space pipeline (fmt/clippy/tests incl. the
# feature-gated VSS job); the frontend job carries the full recovery-wizard
# gate stack (typecheck/lint/format/arch-lint/ast-grep/knip/jscpd/coverage/
# build/bundle budget).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (stable, windows)
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain: [stable]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --lib --no-deps -- -D warnings

      - name: Tests
        run: cargo test --lib --no-fail-fast

  rust-vss:
    name: Rust (vss feature, windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Clippy with vss feature (deny warnings)
        run: cargo clippy --lib --no-deps --features vss -- -D warnings

      - name: Tests with vss feature
        run: cargo test --lib --features vss --no-fail-fast

  frontend:
    name: Frontend (React gates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Architecture lint
        run: pnpm arch:lint

      - name: ast-grep rules (no raw invoke outside connector)
        shell: bash
        run: |
          npx ast-grep scan --globs '!src/connector/**' rules/no-raw-invoke.yml | grep -q "error\[" && exit 1 || true
          npx ast-grep scan rules/no-raw-invoke.yml | grep -q "error\[" && exit 1 || true
          npx ast-grep scan --globs '!src/queries/**' --globs '!src/connector/**' rules/no-connector-import-outside-queries.yml | grep -q "error\[" && exit 1 || true
          npx ast-grep scan rules/no-connector-import-outside-queries.yml | grep -q "error\[" && exit 1 || true

      - name: Knip
        run: pnpm knip
        env:
          KNIP_DISABLE_RAW_TRANSFER: "1"

      - name: Copy-paste detection
        run: pnpm jscpd

      - name: Unit tests (coverage thresholds)
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Bundle budget
        run: pnpm bundle:check
        env:
          BUDGET_MAIN_KB: "200"
          BUDGET_TOTAL_KB: "500"

      - name: Rust shell check (engine compiles with the UI)
        run: cargo check --manifest-path src-tauri/Cargo.toml
