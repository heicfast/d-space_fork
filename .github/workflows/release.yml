name: Release

# DiskWizard release — tag push v*.*.* builds MSI + NSIS with updater
# artifacts (.sig + latest.json signed via the Ed25519 key in repo secrets),
# guarded by a version-match gate (tag must equal tauri.conf.json version).
# The build runs with the REAL tauri connector (VITE_CONNECTOR=tauri) — a
# mock-connector build must never ship.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Version match gate
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$CONF" ]; then
            echo "Tag v$TAG does not match tauri.conf.json version $CONF"
            exit 1
          fi
          echo "Version gate passed: $TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_CONNECTOR: tauri
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DiskWizard ${{ github.ref_name }}"
          releaseBody: |
            DiskWizard — Windows data recovery wizard and safe disk cleanup.

            **What's inside**
            - Raw NTFS recovery engine: deleted-file discovery, confidence grading, bounded previews, verified recovery to any destination
            - Space analysis with a 100-point safe-cleanup score and a guaranteed undo (staging + 24h restore window)
            - Duplicate finder, snapshots, disk health, volume repair
            - Fully local: no telemetry, no cloud

            **Install**
            - Windows 10 (1809+) / 11, x64. Two installers: `.msi` (WiX) and `-setup.exe` (NSIS).
            - The app requests administrator privileges at launch — required for raw volume access, deleted-file recovery and the MFT engine.

            **Notes**
            - Builds are unsigned (EV certificate is a v1.0 roadmap item) — SmartScreen may warn on first run. Verify the SHA-256 checksums on the release assets.
            - Licensed under GPL-3.0-or-later.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          includeUpdaterJson: true

      - name: Generate checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          for f in msi/*.msi nsis/*.exe nsis/*.sig msi/*.sig latest.json; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256" || true
          done
          ls -R msi nsis 2>/dev/null || true

      - name: Attach checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi.sha256
            src-tauri/target/release/bundle/nsis/*.exe.sha256
